[project]
name = "vaultpass_backend"
version = "0.1.0"
description = "A secure password vault backend"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn[standard] (>=0.47.0,<0.48.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)"
]


[tool.poetry]
packages = [{include = "vaultpass_backend", from = "src"}]

[tool.poetry.scripts]
start = "vaultpass_backend.run:start"

[project.scripts]
start = "vaultpass_backend.run:start"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "ruff (>=0.15.14,<0.16.0)"
]
